name: Android CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  release:
    types: [ published ]

# Cancel outdated runs on the same branch/PR
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Cache Android SDK packages
        uses: actions/cache@v4
        with:
          path: |
            ${{ env.ANDROID_HOME }}/platforms
            ${{ env.ANDROID_HOME }}/build-tools
            ${{ env.ANDROID_HOME }}/platform-tools
            ${{ env.ANDROID_HOME }}/cmdline-tools
          key: android-sdk-${{ runner.os }}-api35-bt35
          restore-keys: |
            android-sdk-${{ runner.os }}-

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses >/dev/null || true

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          cache-read-only: ${{ github.ref != 'refs/heads/main' && github.ref != 'refs/heads/master' }}
          gradle-home-cache-cleanup: true

      - name: Ensure Gradle Wrapper
        run: |
          if [ ! -f gradlew ]; then
            gradle wrapper --gradle-version 8.9
          fi
          chmod +x gradlew

      # PRs: debug only (faster feedback)
      - name: Build debug APK
        if: github.event_name == 'pull_request'
        run: ./gradlew assembleDebug --build-cache --parallel --stacktrace

      # main / release: debug + release in one Gradle invocation
      - name: Build debug + release APKs
        if: github.event_name != 'pull_request'
        run: ./gradlew assembleDebug assembleRelease --build-cache --parallel --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: AirType-debug
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload release APK (unsigned)
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: AirType-release-unsigned
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 30
